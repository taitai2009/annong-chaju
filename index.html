<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>纯加载测试</title>
<style>
html,body{margin:0;height:100%;background:#f5f2ec;font-family:system-ui;padding:20px;box-sizing:border-box}
#log{background:#000;color:#0f0;padding:16px;font-size:13px;font-family:monospace;border-radius:8px;white-space:pre-wrap;line-height:1.8;word-break:break-all}
#log .ok{color:#4caf50}
#log .err{color:#ff5252}
</style>
</head>
<body>
<div id="log">启动…</div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
}}
</script>

<script type="module">
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const logEl = document.getElementById('log');
let lines = [];
function log(t, cls) {
  const span = cls ? `<span class="${cls}">${t}</span>` : t;
  lines.push(span);
  logEl.innerHTML = lines.join('<br>');
  console.log(t);
}

log('测试开始');
log('不渲染 3D，只测试 chajuzuhe.glb 能否加载完成');
log('');

const loader = new GLTFLoader();

log('开始加载 chajuzuhe.glb…');

loader.load('./chajuzuhe.glb',
  (gltf) => {
    log('');
    log('✓ 文件加载成功！', 'ok');

    /* 遍历统计，不做任何渲染 */
    let meshCount = 0;
    let totalTri = 0;
    let totalTex = 0;
    const texSet = new Set();

    gltf.scene.traverse(o => {
      if (o.isMesh) {
        meshCount++;
        if (o.geometry && o.geometry.index) {
          totalTri += o.geometry.index.count / 3;
        }
        /* 统计贴图 */
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach(m => {
          if (!m) return;
          ['map','normalMap','roughnessMap','metalnessMap','aoMap','emissiveMap'].forEach(k => {
            if (m[k] && m[k].image) {
              if (!texSet.has(m[k].image)) {
                texSet.add(m[k].image);
                totalTex++;
              }
            }
          });
        });
      }
    });

    log('');
    log('【模型统计】');
    log('  顶层子级数量: ' + gltf.scene.children.length);
    log('  mesh 总数: ' + meshCount);
    log('  三角形总数: ' + Math.round(totalTri));
    log('  贴图总数: ' + totalTex);
    log('');
    log('✓ 全部统计完成，没有崩溃', 'ok');
    log('');
    log('→ 说明文件本身没问题，是渲染时内存爆了');
  },
  (xhr) => {
    if (xhr.total > 0) {
      const p = Math.round(xhr.loaded / xhr.total * 100);
      const mb = (xhr.loaded / 1024 / 1024).toFixed(1);
      lines[lines.length - 1] = `加载中… ${p}%  (${mb} MB)`;
      logEl.innerHTML = lines.join('<br>');
    } else {
      lines[lines.length - 1] = `加载中… 已下载 ${(xhr.loaded / 1024 / 1024).toFixed(1)} MB`;
      logEl.innerHTML = lines.join('<br>');
    }
  },
  (err) => {
    log('');
    log('✗ 加载失败！', 'err');
    log(String(err), 'err');
    console.error(err);
  }
);

/* 心跳，看页面是否还活着 */
let beat = 0;
setInterval(() => {
  beat++;
  document.title = '心跳 ' + beat;
}, 1000);

/* 捕获错误 */
window.addEventListener('error', (e) => {
  log('');
  log('✗ 页面出错: ' + e.message, 'err');
});
</script>
</body>
</html>
