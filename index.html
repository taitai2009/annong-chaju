<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>茶席组合 · DEMO</title>
<style>
:root{--bg:#f5f2ec;--ink:#2b2620;--ink-2:#6b6259;--gold:#b8935a;--card:rgba(255,255,255,.85);--shadow:0 8px 32px rgba(43,38,32,.12);--gui-width:280px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none;
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  color:var(--ink);background:var(--bg);-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none}
canvas{display:block;touch-action:none}
body.layout-mobile-landscape{--gui-width:220px}
body.layout-mobile-portrait{--gui-width:260px}

/* 目录面板 */
#catalog{background:var(--card);backdrop-filter:blur(20px);box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;z-index:10;transition:transform .3s}
#catalogHeader{padding:16px 18px 14px;border-bottom:1px solid rgba(43,38,32,.08);flex-shrink:0}
#catalogTitle{font-size:15px;font-weight:600;letter-spacing:.1em;margin-bottom:10px}
#breadcrumb{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:11px;color:var(--ink-2);min-height:18px}
.bc-item{cursor:pointer;padding:2px 6px;border-radius:6px;transition:.2s;white-space:nowrap}
.bc-item:hover{background:rgba(184,147,90,.12);color:var(--ink)}
.bc-item.current{color:var(--gold);font-weight:600;cursor:default}
.bc-item.current:hover{background:transparent}
.bc-sep{color:rgba(43,38,32,.3);font-size:10px}
#backBtn{margin-top:10px;padding:8px 14px;border:0;border-radius:10px;background:rgba(43,38,32,.06);color:var(--ink);font-size:12px;cursor:pointer;display:none;align-items:center;gap:6px}
#backBtn.show{display:inline-flex}
#catalogBody{flex:1;overflow-y:auto;padding:14px;touch-action:pan-y}
.item{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:8px;border-radius:12px;cursor:pointer;background:rgba(255,255,255,.5);border:1px solid rgba(43,38,32,.06);position:relative}
.item:hover{background:#fff;border-color:rgba(184,147,90,.4);transform:translateX(3px)}
.item-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(184,147,90,.12);color:var(--gold);font-size:16px;flex-shrink:0}
.item-icon.leaf{background:rgba(43,38,32,.06);color:var(--ink-2)}
.item-icon.has-model{background:rgba(76,175,80,.15);color:#4caf50}
.item-dot{position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:#4caf50}
.item-text{flex:1;min-width:0}
.item-name{font-size:13px;font-weight:500;line-height:1.35}
.item-count{font-size:10px;color:var(--ink-2);margin-top:2px}
.item-arrow{font-size:14px;color:rgba(43,38,32,.25);flex-shrink:0}
.item-plus{font-size:18px;color:var(--gold);flex-shrink:0;opacity:.7}

#drawerHandle{display:none;position:relative;height:62px;flex-shrink:0;align-items:center;justify-content:space-between;padding:0 18px;cursor:pointer;border-bottom:1px solid rgba(43,38,32,.06)}
#drawerHandle .handle-bar{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:40px;height:4px;border-radius:2px;background:rgba(43,38,32,.18)}
#drawerHandle .handle-text{font-size:14px;font-weight:600}
#drawerHandle .handle-icon{font-size:14px;color:var(--ink-2);transition:transform .3s}

body.layout-desktop #catalog{position:fixed;left:20px;top:20px;bottom:20px;width:300px;border-radius:18px}
body.layout-tablet #catalog{position:fixed;left:12px;top:12px;bottom:12px;width:220px;border-radius:14px}
body.layout-tablet .item{padding:10px 12px;gap:8px}
body.layout-tablet .item-count{display:none}
body.layout-mobile-portrait #catalog{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;max-height:60vh;border-radius:18px 18px 0 0;transform:translateY(calc(100% - 62px))}
body.layout-mobile-portrait #catalog.open{transform:translateY(0)}
body.layout-mobile-portrait #drawerHandle{display:flex}
body.layout-mobile-portrait #catalogTitle{display:none}
body.layout-mobile-landscape #catalog{position:fixed;left:8px;top:8px;bottom:8px;width:200px;border-radius:12px}
body.layout-mobile-landscape .item{padding:8px 10px;gap:6px}
body.layout-mobile-landscape .item-count{display:none}

#guiToggle{position:fixed;right:0;top:50%;transform:translateY(-50%);width:38px;padding:16px 6px;border:0;border-radius:12px 0 0 12px;background:rgba(43,38,32,.82);color:#fff;font-size:12px;letter-spacing:.15em;writing-mode:vertical-rl;cursor:pointer;z-index:51;transition:.3s}
#guiToggle.open{transform:translateY(-50%) translateX(calc(-1 * var(--gui-width)));background:rgba(184,147,90,.95)}

.lil-gui.root{position:fixed !important;right:0 !important;top:70px !important;bottom:70px !important;width:var(--gui-width) !important;max-height:none !important;border-radius:14px 0 0 14px !important;overflow-y:auto !important;transition:transform .3s !important;z-index:50 !important;transform:translateX(100%)}
.lil-gui.root > .title > .close-button{display:none !important}

#historyBtns{position:fixed;right:16px;top:16px;display:flex;flex-direction:column;gap:8px;z-index:100}
.hist-btn{width:46px;height:46px;display:flex;align-items:center;justify-content:center;border:0;border-radius:13px;cursor:pointer;background:rgba(43,38,32,.82);color:#fff;font-size:20px}
.hist-btn:disabled{opacity:.3}
.hist-count{font-size:10px;text-align:center;color:#fff;background:rgba(43,38,32,.6);border-radius:8px;padding:3px 0}

#bottomBar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10}
#clearBtn{padding:12px 28px;border:0;border-radius:14px;cursor:pointer;background:var(--ink);color:#fff;font-size:13px;letter-spacing:.15em}
body.layout-mobile-portrait #bottomBar{bottom:78px}

#info{position:fixed;left:50%;top:18px;transform:translateX(-50%);padding:7px 16px;border-radius:99px;background:rgba(43,38,32,.85);color:#fff;font-size:11px;z-index:20;max-width:70vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#info.ok{background:rgba(52,120,80,.9)}
#info.err{background:rgba(180,60,60,.9)}

#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%) translateY(10px);background:rgba(0,0,0,.85);color:#fff;padding:10px 22px;border-radius:24px;font-size:12px;z-index:1000;opacity:0;transition:.3s;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#rotateHint{position:fixed;left:50%;top:12px;transform:translateX(-50%);padding:8px 18px;border-radius:24px;background:rgba(43,38,32,.85);color:#fff;font-size:11px;z-index:100;opacity:0;transition:.5s;pointer-events:none;display:none}
body.layout-mobile-portrait #rotateHint{display:flex}
#rotateHint.show{opacity:1}

.lil-gui{--background-color:rgba(255,255,255,.9);--text-color:#2b2620;--title-background-color:rgba(255,255,255,.95);--title-text-color:#2b2620;--widget-color:rgba(43,38,32,.08);--number-color:#b8935a;--string-color:#6b6259;--font-family:"PingFang SC","Microsoft YaHei",sans-serif;--font-size:12px;--title-height:34px;backdrop-filter:blur(20px);box-shadow:0 8px 32px rgba(43,38,32,.14);border:1px solid rgba(255,255,255,.6);border-right:0}
.lil-gui > .title{background:rgba(255,255,255,.95) !important;color:#2b2620 !important;border-bottom:1px solid rgba(43,38,32,.08)}
.lil-gui input[type="number"]{color:#b8935a;background:transparent}
.lil-gui .slider .fill{background:#b8935a}
.lil-gui button{background:rgba(43,38,32,.06);color:#2b2620}
.lil-gui .controller.boolean .widget input:checked + .toggle{background:#b8935a !important}

/* DEMO 模式：只展示不激活 */
body.demo-mode #catalogBody{pointer-events:none;filter:grayscale(.35);opacity:.75}
body.demo-mode #catalogBody .item{transform:none !important;cursor:default}
body.demo-mode .lil-gui.root .children{opacity:.55}
body.demo-mode .hist-btn{pointer-events:none;opacity:.35}
body.demo-mode #clearBtn{pointer-events:none;opacity:.35}
body.demo-mode #catalog::after{content:'DEMO · 仅供浏览';position:absolute;bottom:8px;right:12px;font-size:9px;color:var(--gold);letter-spacing:.15em;opacity:.7}
</style>
</head>
<body class="layout-desktop demo-mode">

<script>
  /* 阻止手机下拉刷新、侧滑返回、双击缩放 */
  document.addEventListener('touchmove', function(e) {
    if (e.target.closest('#catalogBody') || e.target.closest('.lil-gui')) return;
    if (e.touches.length > 1) return;
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault());
  document.addEventListener('gesturechange', (e) => e.preventDefault());
  document.addEventListener('gestureend', (e) => e.preventDefault());
  let lastTouch = 0;
  document.addEventListener('touchend', (e) => {
    const now = Date.now();
    if (now - lastTouch < 300) e.preventDefault();
    lastTouch = now;
  }, { passive: false });
</script>

<div id="info">加载中…</div>
<div id="rotateHint">⟳ 横屏观看效果更好</div>

<div id="catalog">
  <div id="drawerHandle">
    <div class="handle-bar"></div>
    <span class="handle-text">茶席器具</span>
    <span class="handle-icon">▲</span>
  </div>
  <div id="catalogHeader">
    <div id="catalogTitle">茶席器具</div>
    <div id="breadcrumb"></div>
    <button id="backBtn">← 返回上级</button>
  </div>
  <div id="catalogBody"></div>
</div>

<button id="guiToggle">调 节</button>
<div id="historyBtns">
  <button class="hist-btn" id="undoBtn" disabled>↶</button>
  <div class="hist-count" id="undoCount">0</div>
  <button class="hist-btn" id="redoBtn" disabled>↷</button>
  <div class="hist-count" id="redoCount">0</div>
</div>
<div id="bottomBar"><button id="clearBtn">清空桌面</button></div>
<div id="toast"></div>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/",
  "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19.2/dist/lil-gui.esm.js"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import GUI from 'lil-gui';

/* ============ 目录数据（仅展示） ============ */
const CATALOG = [
  { name:'冲泡器具', children:[
    { name:'茶壶', children:[
      { name:'紫砂茶壶', children:[
        { name:'大型壶（300ml以上）', id:'zisha-large' },
        { name:'中型壶（150-300ml）', id:'zisha-mid' },
        { name:'小型壶（150ml以下）', id:'zisha-small', hasModel:true }
      ]},
      { name:'瓷茶壶（青花、白瓷、彩瓷）', children:[
        { name:'青花瓷壶', id:'qinghua', hasModel:true },
        { name:'白瓷壶',   id:'baici' },
        { name:'彩瓷壶',   id:'caici' }
      ]},
      { name:'玻璃茶壶', children:[
        { name:'大型壶（300ml以上）', id:'glass-large' },
        { name:'中型壶（150-300ml）', id:'glass-mid' }
      ]}
    ]},
    { name:'盖碗', children:[
      { name:'紫砂盖碗', children:[
        { name:'紫砂盖碗', id:'gaiwan-zisha' }
      ]},
      { name:'瓷质盖碗', children:[
        { name:'大型盖碗（200ml以上）', id:'gaiwan-large' },
        { name:'普通盖碗（200ml以下）', id:'gaiwan-small', hasModel:true }
      ]}
    ]},
    { name:'玻璃杯', children:[
      { name:'直升杯', id:'glass-tall' },
      { name:'小型杯', id:'glass-small' }
    ]},
    { name:'异形冲泡器', children:[
      { name:'绿茶冲泡器', id:'lvcha' },
      { name:'其他冲泡器', id:'other-brew' }
    ]}
  ]},
  { name:'品饮器具', children:[] },
  { name:'辅助茶具', children:[] },
  { name:'装饰艺术品', children:[] }
];

/* ============ 配置 ============ */
const CONFIG = {
  background: 0xf5f2ec,
  camera: { targetX:0, targetZ:0, targetH:0.85, angle:0, elevation:25, distance:2, fov:40 },

  envIntensity: 1,
  exposure: 1,

  lights: {
    hemi: 3,          /* ★ 天光 3 */
    ambient: 1,
    key: 3,
    fill: 1.5,
    rim: 1
  },

  keyPos:  { x:-4, y:8, z:4 },
  fillPos: { x: 4, y:4, z:5 },
  rimPos:  { x: 0, y:5, z:-6 },

  materialBoost: { enabled:true, envMapIntensity:1.5, addClearcoat:true, clearcoat:0.35, clearcoatRoughness:0.10 },
  contactShadow: { enabled:true, radius:0.08, distanceExponent:1.0, thickness:0.5, scale:1.0, samples:16, distanceFallOff:1.0, screenSpaceRadius:false },
  view: { contrast:1.15, brightness:-0.05 },
  interaction: { tableMargin:0.03, chajuzuheRadiusScale:0.5 }
};
const HDR_CANDIDATES = ['./backlight.hdr','./chashi.hdr','./studio.hdr','./room.hdr'];

function detectLayout() {
  const w = innerWidth, h = innerHeight;
  if (w >= 1024) return 'layout-desktop';
  if (w >= 768) return 'layout-tablet';
  if (h > w) return 'layout-mobile-portrait';
  return 'layout-mobile-landscape';
}
function applyLayout() {
  const m = detectLayout();
  document.body.classList.remove('layout-desktop','layout-tablet','layout-mobile-portrait','layout-mobile-landscape');
  document.body.classList.add(m);
  return m;
}
let currentLayout = detectLayout();

/* ============ 场景 ============ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(CONFIG.background);
const camera = new THREE.PerspectiveCamera(CONFIG.camera.fov, innerWidth/innerHeight, 0.01, 10000);
camera.position.set(0, 1.5, 3);

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = CONFIG.exposure;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const ContrastShader = {
  uniforms:{ tDiffuse:{value:null}, contrast:{value:CONFIG.view.contrast}, brightness:{value:CONFIG.view.brightness} },
  vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
  fragmentShader: 'uniform sampler2D tDiffuse; uniform float contrast; uniform float brightness; varying vec2 vUv; void main(){ vec4 c=texture2D(tDiffuse,vUv); c.rgb=(c.rgb-0.5)*contrast+0.5+brightness; gl_FragColor=c;}'
};

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const gtaoPass = new GTAOPass(scene, camera, innerWidth, innerHeight);
gtaoPass.output = GTAOPass.OUTPUT.Default;
gtaoPass.enabled = false;
updateGTAO();
composer.addPass(gtaoPass);
composer.addPass(new OutputPass());
const contrastPass = new ShaderPass(ContrastShader);
composer.addPass(contrastPass);

function updateGTAO() {
  const C = CONFIG.contactShadow;
  gtaoPass.enabled = C.enabled;
  gtaoPass.updateGtaoMaterial({ radius:C.radius, distanceExponent:C.distanceExponent, thickness:C.thickness, scale:C.scale, samples:C.samples, distanceFallOff:C.distanceFallOff, screenSpaceRadius:C.screenSpaceRadius });
}

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.enablePan = true;

const pmrem = new THREE.PMREMGenerator(renderer);
pmrem.compileEquirectangularShader();
let currentEnvTexture = null;
const defaultEnvTexture = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environment = defaultEnvTexture;
scene.environmentIntensity = CONFIG.envIntensity;
const hdrState = { path:'./backlight.hdr', showBg:false };

function tryLoadHDRIFromCandidates() {
  let i = 0;
  function next() {
    if (i >= HDR_CANDIDATES.length) { infoEl.textContent = '✓ 已加载'; infoEl.className = 'ok'; return; }
    const path = HDR_CANDIDATES[i++];
    new RGBELoader().load(path,
      (hdr) => {
        if (currentEnvTexture) currentEnvTexture.dispose();
        currentEnvTexture = pmrem.fromEquirectangular(hdr).texture;
        scene.environment = currentEnvTexture;
        scene.environmentIntensity = CONFIG.envIntensity;
        if (hdrState.showBg) scene.background = currentEnvTexture;
        hdr.dispose();
        hdrState.path = path;
        infoEl.textContent = `✓ 已加载`;
        infoEl.className = 'ok';
        if (gui) gui.controllersRecursive().forEach(c => c.updateDisplay());
      },
      undefined, () => next()
    );
  }
  next();
}

/* ============ 灯光 ============ */
const L = CONFIG.lights;
const hemiLight = new THREE.HemisphereLight(0xffffff, 0xd8c8b0, L.hemi); scene.add(hemiLight);
const ambientLight = new THREE.AmbientLight(0xffffff, L.ambient); scene.add(ambientLight);

const keyLight = new THREE.DirectionalLight(0xfff5e8, L.key);
keyLight.position.set(CONFIG.keyPos.x, CONFIG.keyPos.y, CONFIG.keyPos.z);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.near = 0.1; keyLight.shadow.camera.far = 50;
keyLight.shadow.bias = -0.0005; keyLight.shadow.radius = 6;
scene.add(keyLight); scene.add(keyLight.target);

const fillLight = new THREE.DirectionalLight(0xffffff, L.fill);
fillLight.position.set(CONFIG.fillPos.x, CONFIG.fillPos.y, CONFIG.fillPos.z);
scene.add(fillLight); scene.add(fillLight.target);

const rimLight = new THREE.DirectionalLight(0xffffff, L.rim);
rimLight.position.set(CONFIG.rimPos.x, CONFIG.rimPos.y, CONFIG.rimPos.z);
scene.add(rimLight); scene.add(rimLight.target);

/* ============ 相机 ============ */
let roomSize = null;
function applyCamera() {
  const C = CONFIG.camera;
  const radA = (C.angle * Math.PI) / 180;
  const radE = (C.elevation * Math.PI) / 180;
  const horiz = Math.cos(radE) * C.distance;
  const vert = Math.sin(radE) * C.distance;
  let df = 1;
  if (currentLayout === 'layout-mobile-portrait') df = 1.6;
  else if (currentLayout === 'layout-mobile-landscape') df = 1.3;
  camera.position.set(C.targetX + Math.sin(radA) * horiz * df, C.targetH + vert * df, C.targetZ + Math.cos(radA) * horiz * df);
  camera.fov = C.fov;
  camera.updateProjectionMatrix();
  controls.target.set(C.targetX, C.targetH, C.targetZ);
  controls.update();
}

/* ============ 材质增强 ============ */
const boostedMaterials = [];
function boostMaterial(mat) {
  if (!mat) return mat;
  if (mat.isMeshStandardMaterial && !mat.isMeshPhysicalMaterial) {
    const p = new THREE.MeshPhysicalMaterial({
      map: mat.map, color: mat.color ? mat.color.clone() : new THREE.Color(0xffffff),
      roughness: mat.roughness !== undefined ? mat.roughness : 0.5,
      metalness: mat.metalness !== undefined ? mat.metalness : 0,
      normalMap: mat.normalMap, aoMap: mat.aoMap,
      transparent: mat.transparent, opacity: mat.opacity, side: mat.side,
      envMapIntensity: CONFIG.materialBoost.envMapIntensity,
      clearcoat: CONFIG.materialBoost.addClearcoat ? CONFIG.materialBoost.clearcoat : 0,
      clearcoatRoughness: CONFIG.materialBoost.clearcoatRoughness
    });
    boostedMaterials.push(p);
    return p;
  }
  if (mat.isMeshPhysicalMaterial) {
    mat.envMapIntensity = CONFIG.materialBoost.envMapIntensity;
    mat.needsUpdate = true;
    boostedMaterials.push(mat);
  }
  return mat;
}
function applyMaterialBoost(root) {
  (root || scene).traverse(o => {
    if (!o.isMesh) return;
    if (Array.isArray(o.material)) o.material = o.material.map(m => boostMaterial(m));
    else o.material = boostMaterial(o.material);
  });
}

/* ============ 支撑面 ============ */
const SUPPORTS = [];

function scanSupports(root) {
  root.updateMatrixWorld(true);
  SUPPORTS.length = 0;
  root.traverse((o) => {
    if (!o.name) return;
    const name = o.name.toLowerCase();
    let kind = null;
    if (name.includes('zhuo') || name.includes('table')) kind = 'table';
    else if (name.includes('chaxi')) kind = 'mat';
    if (!kind) return;
    const box = new THREE.Box3().setFromObject(o);
    if (box.isEmpty()) return;
    SUPPORTS.push({
      name: o.name, node: o,
      minX: box.min.x, maxX: box.max.x,
      minZ: box.min.z, maxZ: box.max.z,
      topY: box.max.y, isMat: kind === 'mat'
    });
  });
  SUPPORTS.sort((a, b) => a.topY - b.topY);
  console.log('============ 支撑面 ============');
  SUPPORTS.forEach(s => {
    const cx = (s.minX + s.maxX) / 2;
    const cz = (s.minZ + s.maxZ) / 2;
    console.log(`  ${s.name}: topY=${s.topY.toFixed(3)} 中心=(${cx.toFixed(3)},${cz.toFixed(3)})`);
  });
}

function getSupportAt(x, z) {
  let best = null;
  for (const s of SUPPORTS) {
    if (x >= s.minX && x <= s.maxX && z >= s.minZ && z <= s.maxZ) {
      if (!best || s.topY > best.topY) best = s;
    }
  }
  return best;
}
function getGroundY(x, z) {
  const s = getSupportAt(x, z);
  return s ? s.topY : 0;
}
function getTableSupport() {
  let s = SUPPORTS.find(s => s.name.toLowerCase().includes('zhuo'));
  if (!s) s = SUPPORTS.find(s => !s.isMat);
  return s || null;
}

/* ============ 目录 UI（仅展示） ============ */
const catalogState = { path: [] };
const catalogEl = document.getElementById('catalog');
const catalogBody = document.getElementById('catalogBody');
const breadcrumbEl = document.getElementById('breadcrumb');
const backBtn = document.getElementById('backBtn');
const drawerHandle = document.getElementById('drawerHandle');

drawerHandle.addEventListener('click', (e) => {
  if (currentLayout !== 'layout-mobile-portrait') return;
  e.stopPropagation();
  catalogEl.classList.toggle('open');
});

function getCurrentItems() {
  let n = { children: CATALOG };
  for (const i of catalogState.path) if (n.children && n.children[i]) n = n.children[i];
  return n.children || [];
}
function countLeaves(node) {
  if (!node.children || node.children.length === 0) return 1;
  let n = 0;
  for (const c of node.children) n += countLeaves(c);
  return n;
}
function renderBreadcrumb() {
  const parts = [{ name:'茶席器具', path:[] }];
  let n = { children: CATALOG };
  const cur = [];
  for (const i of catalogState.path) {
    if (n.children && n.children[i]) {
      n = n.children[i]; cur.push(i);
      parts.push({ name:n.name, path:[...cur] });
    }
  }
  breadcrumbEl.innerHTML = '';
  parts.forEach((p, i) => {
    if (i > 0) {
      const s = document.createElement('span');
      s.className = 'bc-sep'; s.textContent = '/';
      breadcrumbEl.appendChild(s);
    }
    const el = document.createElement('span');
    el.className = 'bc-item' + (i === parts.length-1 ? ' current' : '');
    el.textContent = p.name;
    breadcrumbEl.appendChild(el);
  });
  backBtn.classList.toggle('show', catalogState.path.length > 0);
}
function renderCatalog() {
  renderBreadcrumb();
  const items = getCurrentItems();
  catalogBody.innerHTML = '';
  if (items.length === 0) {
    const e = document.createElement('div');
    e.style.cssText = 'text-align:center;padding:40px 20px;color:#6b6259;font-size:12px';
    e.textContent = '（空）';
    catalogBody.appendChild(e);
    return;
  }
  items.forEach((item, idx) => {
    const isLeaf = !item.children || item.children.length === 0;
    const hasModel = !!(item.hasModel);
    const el = document.createElement('div');
    el.className = 'item';
    if (hasModel) {
      const dot = document.createElement('span');
      dot.className = 'item-dot';
      el.appendChild(dot);
    }
    const icon = document.createElement('div');
    icon.className = 'item-icon' + (isLeaf ? ' leaf' : '') + (hasModel ? ' has-model' : '');
    icon.textContent = isLeaf ? '◈' : '▸';
    el.appendChild(icon);

    const text = document.createElement('div');
    text.className = 'item-text';
    const nm = document.createElement('div');
    nm.className = 'item-name';
    nm.textContent = item.name;
    text.appendChild(nm);
    const cnt = document.createElement('div');
    cnt.className = 'item-count';
    cnt.textContent = isLeaf ? (hasModel ? '✓ 有模型' : '占位') : `${countLeaves(item)} 项`;
    text.appendChild(cnt);
    el.appendChild(text);

    const ar = document.createElement('div');
    ar.className = isLeaf ? 'item-plus' : 'item-arrow';
    ar.textContent = isLeaf ? '+' : '›';
    el.appendChild(ar);

    catalogBody.appendChild(el);
  });
}

/* ============ 已放物品 ============ */
const placedItems = [];
let selectedInstance = null;
let selectionRing = null;

function selectItem(inst) { selectedInstance = inst; updateSelectionRing(); }
function updateSelectionRing() {
  if (!selectionRing) {
    const g = new THREE.RingGeometry(1, 1.05, 48);
    g.rotateX(-Math.PI / 2);
    selectionRing = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color:0xb8935a, transparent:true, opacity:0.8, side:THREE.DoubleSide, depthTest:false }));
    selectionRing.renderOrder = 999;
    scene.add(selectionRing);
  }
  if (!selectedInstance) { selectionRing.visible = false; return; }
  selectionRing.visible = true;
  const r = selectedInstance.radius;
  selectionRing.scale.set(r, r, r);
  selectionRing.position.set(
    selectedInstance.object.position.x,
    selectedInstance.object.position.y + 0.002,
    selectedInstance.object.position.z
  );
}

/* ============ 拖拽 ============ */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const dragPlane = new THREE.Plane();
const dragOffset = new THREE.Vector3();
const dragHit = new THREE.Vector3();
let dragging = null;

function updatePointer(e) {
  const r = renderer.domElement.getBoundingClientRect();
  pointer.x = ((e.clientX - r.left) / r.width) * 2 - 1;
  pointer.y = -((e.clientY - r.top) / r.height) * 2 + 1;
}
function pickInstance() {
  raycaster.setFromCamera(pointer, camera);
  const ms = [];
  placedItems.forEach(it => it.object.traverse(c => { if (c.isMesh) ms.push(c); }));
  const hits = raycaster.intersectObjects(ms);
  if (!hits.length) return null;
  const hm = hits[0].object;
  for (const it of placedItems) {
    let f = false;
    it.object.traverse(c => { if (c === hm) f = true; });
    if (f) return it;
  }
  return null;
}
function isFree(x, z, radius, ignore) {
  for (const it of placedItems) {
    if (it === ignore) continue;
    const dx = x - it.object.position.x;
    const dz = z - it.object.position.z;
    const d = radius + it.radius;
    if (dx*dx + dz*dz < d*d) return false;
  }
  return true;
}

renderer.domElement.addEventListener('pointerdown', (e) => {
  updatePointer(e);
  const hit = pickInstance();
  if (hit) {
    selectItem(hit);
    dragging = hit;
    dragPlane.set(new THREE.Vector3(0,1,0), -hit.object.position.y);
    raycaster.setFromCamera(pointer, camera);
    raycaster.ray.intersectPlane(dragPlane, dragHit);
    dragOffset.copy(hit.object.position).sub(dragHit);
    controls.enabled = false;
    renderer.domElement.setPointerCapture(e.pointerId);
  } else selectItem(null);
});
renderer.domElement.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  updatePointer(e);
  raycaster.setFromCamera(pointer, camera);
  if (!raycaster.ray.intersectPlane(dragPlane, dragHit)) return;

  const np = dragHit.clone().add(dragOffset);
  const ref = getTableSupport();
  if (ref) {
    const margin = CONFIG.interaction.tableMargin;
    const r = dragging.radius;
    if (np.x < ref.minX + margin + r) np.x = ref.minX + margin + r;
    if (np.x > ref.maxX - margin - r) np.x = ref.maxX - margin - r;
    if (np.z < ref.minZ + margin + r) np.z = ref.minZ + margin + r;
    if (np.z > ref.maxZ - margin - r) np.z = ref.maxZ - margin - r;
  }

  if (isFree(np.x, np.z, dragging.radius, dragging)) {
    dragging.object.position.x = np.x;
    dragging.object.position.z = np.z;
    dragging.object.position.y = getGroundY(np.x, np.z);
    updateSelectionRing();
  }
});
function endDrag() { if (dragging) { dragging = null; controls.enabled = true; } }
renderer.domElement.addEventListener('pointerup', endDrag);
renderer.domElement.addEventListener('pointercancel', endDrag);

let toastTimer = null;
function showToast(t) {
  const el = document.getElementById('toast');
  el.textContent = t; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1400);
}

/* ============ 加载 chashi.glb ============ */
const infoEl = document.getElementById('info');

new GLTFLoader().load('./chashi.glb',
  (gltf) => {
    const model = gltf.scene;
    let box = new THREE.Box3().setFromObject(model);
    const size = box.getSize(new THREE.Vector3());
    const maxDim = Math.max(size.x, size.y, size.z);
    let scale = 1;
    if (maxDim > 100) scale = 0.001;
    model.scale.setScalar(scale);
    model.updateMatrixWorld(true);

    box = new THREE.Box3().setFromObject(model);
    const size2 = box.getSize(new THREE.Vector3());
    roomSize = { x:size2.x, y:size2.y, z:size2.z };

    scene.add(model);
    model.updateMatrixWorld(true);
    scanSupports(model);

    /* ★ 默认相机：近看桌面 */
    const tableSup = getTableSupport();
    if (tableSup) {
      const cx = (tableSup.minX + tableSup.maxX) / 2;
      const cz = (tableSup.minZ + tableSup.maxZ) / 2;
      const w = Math.max(tableSup.maxX - tableSup.minX, tableSup.maxZ - tableSup.minZ);
      CONFIG.camera.targetX = cx;
      CONFIG.camera.targetZ = cz;
      CONFIG.camera.targetH = tableSup.topY + 0.05;
      CONFIG.camera.distance = w * 0.8;
      CONFIG.camera.elevation = 25;
      CONFIG.camera.fov = 40;
    } else {
      CONFIG.camera.targetH = size2.y * 0.3;
      CONFIG.camera.distance = Math.max(size2.x, size2.z) * 0.7;
    }

    const w = Math.max(size2.x, size2.z);
    CONFIG.contactShadow.radius = w * 0.015;
    CONFIG.contactShadow.thickness = size2.y * 0.05;
    updateGTAO();
    applyCamera();

    controls.minDistance = 0.3;
    controls.maxDistance = w * 5;

    keyLight.shadow.camera.left = -w; keyLight.shadow.camera.right = w;
    keyLight.shadow.camera.top = w; keyLight.shadow.camera.bottom = -w;
    keyLight.shadow.camera.updateProjectionMatrix();

    model.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    if (CONFIG.materialBoost.enabled) applyMaterialBoost(model);
    tryLoadHDRIFromCandidates();

    loadChaJuZuHe();
  },
  undefined,
  (err) => {
    console.error('✗ chashi.glb 加载失败:', err);
    infoEl.textContent = '✗ 茶室加载失败';
    infoEl.className = 'err';
  }
);

/* ============ 加载 chajuzuhe.glb ============ */
function loadChaJuZuHe() {
  new GLTFLoader().load('./chajuzuhe.glb',
    (gltf) => {
      const root = gltf.scene;

      let box = new THREE.Box3().setFromObject(root);
      const size0 = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size0.x, size0.y, size0.z);
      let scale = 1;
      if (maxDim > 100) scale = 0.001;
      if (maxDim < 0.01) scale = 100;
      root.scale.setScalar(scale);
      root.updateMatrixWorld(true);

      const children = [...root.children];
      console.log('chajuzuhe.glb 顶层子级数量:', children.length);

      children.forEach((child, index) => {
        let hasMesh = false;
        child.traverse(c => { if (c.isMesh) hasMesh = true; });
        if (!hasMesh) return;

        child.updateMatrixWorld(true);
        const worldPos = new THREE.Vector3();
        const worldQuat = new THREE.Quaternion();
        const worldScale = new THREE.Vector3();
        child.matrixWorld.decompose(worldPos, worldQuat, worldScale);

        root.remove(child);
        child.position.copy(worldPos);
        child.quaternion.copy(worldQuat);
        child.scale.copy(worldScale);
        scene.add(child);
        child.updateMatrixWorld(true);

        const box2 = new THREE.Box3().setFromObject(child);
        const csize = box2.getSize(new THREE.Vector3());
        const hRadius = Math.max(csize.x, csize.z) / 2;
        const radius = hRadius * CONFIG.interaction.chajuzuheRadiusScale;

        child.traverse(o => {
          if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; }
        });

        placedItems.push({
          object: child,
          radius,
          baseScale: 1,
          type: 'chajuzuhe-' + index,
          name: child.name || `茶具${index + 1}`
        });

        console.log(`  [${index}] ${child.name || '未命名'} 位置(${worldPos.x.toFixed(3)},${worldPos.y.toFixed(3)},${worldPos.z.toFixed(3)}) 半径=${radius.toFixed(3)}`);
      });

      console.log(`✓ chajuzuhe.glb 加载完成，共 ${placedItems.length} 个模型`);

      infoEl.textContent = `✓ 已加载 ${placedItems.length} 件茶具`;
      infoEl.className = 'ok';
      showToast(`已加载 ${placedItems.length} 件茶具，可拖动`);

      if (CONFIG.materialBoost.enabled) applyMaterialBoost();
    },
    undefined,
    (err) => {
      console.error('✗ chajuzuhe.glb 加载失败:', err);
      infoEl.textContent = '✗ 茶具加载失败';
      infoEl.className = 'err';
    }
  );
}

const guiToggle = document.getElementById('guiToggle');

/* ============ 渲染 ============ */
function animate() { requestAnimationFrame(animate); controls.update(); composer.render(); }
animate();

let resizeTimer = null;
function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
  gtaoPass.setSize(innerWidth, innerHeight);
  contrastPass.setSize(innerWidth, innerHeight);
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const nl = applyLayout();
    if (nl !== currentLayout) {
      currentLayout = nl;
      catalogEl.classList.remove('open');
      applyCamera();
    }
  }, 150);
}
addEventListener('resize', onResize);
let orientationTimer = null;
addEventListener('orientationchange', () => {
  clearTimeout(orientationTimer);
  orientationTimer = setTimeout(onResize, 300);
});

const rotateHint = document.getElementById('rotateHint');
function updateRotateHint() {
  if (!rotateHint) return;
  rotateHint.classList.remove('show');
  if (currentLayout === 'layout-mobile-portrait') {
    setTimeout(() => {
      rotateHint.classList.add('show');
      setTimeout(() => rotateHint.classList.remove('show'), 4000);
    }, 500);
  }
}

/* 初始化 */
currentLayout = applyLayout();
renderCatalog();
updateRotateHint();
